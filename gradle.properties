# Batas memori runner CI (ubuntu-latest ~7 GiB) dan container lokal (8 GiB).
# Konfigurasi lama (-Xmx4g + Kotlin daemon terpisah + 4 worker paralel) memicu
# OOM kill saat compileReleaseKotlin/R8 pada 2026-11-11. Nilai di bawah terbukti
# menghasilkan APK debug + rilis tanpa OOM. Jangan dinaikkan tanpa diukur ulang.
org.gradle.jvmargs=-Xmx2g -Dfile.encoding=UTF-8 -Djava.awt.headless=true
org.gradle.parallel=false
kotlin.code.style=official
android.nonTransitiveRClass=true
org.gradle.caching=true
org.gradle.configuration-cache=true
org.gradle.workers.max=2
kotlin.compiler.execution.strategy=in-process
ksp.incremental=true
googleServices.missing.passthrough=true
