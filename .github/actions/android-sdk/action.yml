name: Siapkan Android SDK 36
description: >
  Pakai Android SDK yang sudah terpasang di runner GitHub, terima lisensi, lalu
  pasang platform/build-tools 36. Tidak memakai action pihak ketiga:
  android-actions/setup-android@v3 menjalankan `sdkmanager tools` yang sudah
  tidak ada pada cmdline-tools 16.0 dan menggagalkan job sebelum build dimulai
  (insiden run 43052078287, 2026-11-11).

runs:
  using: composite
  steps:
    - name: Siapkan Android SDK 36
      shell: bash
      run: |
        set -euo pipefail
        if [ -z "${ANDROID_HOME:-}" ]; then
          ANDROID_HOME=/usr/local/lib/android/sdk
        fi
        echo "ANDROID_HOME=$ANDROID_HOME" >> "$GITHUB_ENV"
        echo "ANDROID_SDK_ROOT=$ANDROID_HOME" >> "$GITHUB_ENV"

        SDKMGR="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager 2>/dev/null | sort | tail -n 1)"
        if [ -z "$SDKMGR" ]; then
          SDKMGR="$(command -v sdkmanager || true)"
        fi
        if [ -z "$SDKMGR" ]; then
          echo "::error::sdkmanager tidak ditemukan di $ANDROID_HOME"
          exit 1
        fi
        echo "sdkmanager: $SDKMGR"

        yes | "$SDKMGR" --licenses >/dev/null 2>&1 || true
        "$SDKMGR" --install "platforms;android-36" "build-tools;36.0.0" >/dev/null
        "$SDKMGR" --list_installed | grep -E 'android-36|36\.0\.0' || \
          echo "::warning::Daftar paket tidak menampilkan android-36; install tetap dianggap berhasil."
